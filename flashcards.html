<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VaaniSetu — Flashcards</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
      colors: { brand: { red:'#C91F2B', bg:'#F8F5EF', text:'#334155', muted:'#64748B', border:'#E2E8F0' },
                status: { green:'#10B981', red:'#EF4444', orange:'#F59E0B', purple:'#8B5CF6', blue:'#3B82F6', teal:'#14B8A6' } },
      boxShadow: { 'card':'0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03)' },
      borderRadius: { 'xl':'1rem' } } } }
</script>
<style>
  body { background-color:#F8F5EF; color:#334155; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#CBD5E1; border-radius:3px; }
  .tribal-art { background-image:url(https://lh3.googleusercontent.com/aida-public/AB6AXuDy0a0SgHYmWZXASxHtvY-4m3NV0QHxeUSSISkgD1uR5IGuQ9Z8-CNpXRd3n3QcfzxTEy92IDNHOdMKFIruy1f1t07w63oot7N79f2_tId8pk-WVsChHCr-W2U990JQNJRaryz2FZhGoMwL01qBmTBVUFY3Ze7bYyS7n7yGq5_eiZQgrNTe2ovRKo_LBgL-JyjjJXwvbwOcZF6PcX0nOOqkWfZadocW1OKhuoTiaQ26XxD357eriNDP_w); background-size:cover; background-position:bottom; opacity:0.15; }
  @media (max-width:1024px){ #layout-sidebar{ position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .3s ease; z-index:40; } body.sidebar-open #layout-sidebar{ transform:translateX(0); } body.sidebar-open::after{ content:''; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; } }
</style>
</head>
<body class="font-sans antialiased h-screen flex overflow-hidden" data-page="flashcards">
  <aside id="layout-sidebar"></aside>
  <main class="flex-1 flex flex-col h-full overflow-hidden relative">
    <div id="layout-topbar"></div>
    <div class="flex-1 overflow-y-auto p-8 relative z-10">
      <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
        <div>
          <h2 class="text-2xl font-bold text-gray-900">Flashcards</h2>
          <p class="text-brand-muted mt-1">Create and practice concept-based flashcards.</p>
        </div>
        <button class="bg-brand-red text-white px-6 py-2.5 rounded-lg font-medium text-sm flex items-center gap-2 hover:bg-red-700 transition-colors shadow-sm self-start"><i class="fa-solid fa-plus"></i> Create Flashcard Set</button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-xl p-5 shadow-card border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-red-100 text-brand-red flex items-center justify-center text-xl flex-shrink-0"><i class="fa-solid fa-layer-group"></i></div>
          <div><h3 class="text-2xl font-bold text-gray-900 leading-tight">9</h3><p class="text-sm font-medium text-gray-700">Total Sets</p></div>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-card border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-purple-100 text-status-purple flex items-center justify-center text-xl flex-shrink-0"><i class="fa-solid fa-rectangle-list"></i></div>
          <div><h3 class="text-2xl font-bold text-gray-900 leading-tight">45</h3><p class="text-sm font-medium text-gray-700">Flashcards</p></div>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-card border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-green-100 text-status-green flex items-center justify-center text-xl flex-shrink-0"><i class="fa-solid fa-fire"></i></div>
          <div><h3 class="text-2xl font-bold text-gray-900 leading-tight">Plant Bio</h3><p class="text-sm font-medium text-gray-700">Most Practiced</p></div>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-card border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-yellow-100 text-status-orange flex items-center justify-center text-xl flex-shrink-0"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
          <div><h3 class="text-2xl font-bold text-gray-900 leading-tight">6</h3><p class="text-sm font-medium text-gray-700">AI Generated</p></div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
        <div class="bg-white rounded-xl border border-gray-100 shadow-card p-5">
          <div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-lg bg-red-100 text-brand-red flex items-center justify-center"><i class="fa-solid fa-leaf"></i></div><div><h4 class="font-bold text-gray-900">Photosynthesis</h4><p class="text-xs text-brand-muted">Science · Class 6</p></div></div>
          <p class="text-sm text-brand-muted mb-4">12 Flashcards</p>
          <button class="w-full py-2.5 bg-brand-red text-white rounded-lg font-medium text-sm hover:bg-red-700 transition-colors">Practice</button>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-card p-5">
          <div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-lg bg-green-100 text-status-green flex items-center justify-center"><i class="fa-solid fa-seedling"></i></div><div><h4 class="font-bold text-gray-900">Plant Biology</h4><p class="text-xs text-brand-muted">Science · Class 6</p></div></div>
          <p class="text-sm text-brand-muted mb-4">18 Flashcards</p>
          <button class="w-full py-2.5 bg-brand-red text-white rounded-lg font-medium text-sm hover:bg-red-700 transition-colors">Practice</button>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-card p-5">
          <div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-lg bg-purple-100 text-status-purple flex items-center justify-center"><i class="fa-solid fa-earth-asia"></i></div><div><h4 class="font-bold text-gray-900">Environmental Science</h4><p class="text-xs text-brand-muted">Science · Class 6</p></div></div>
          <p class="text-sm text-brand-muted mb-4">15 Flashcards</p>
          <button class="w-full py-2.5 bg-brand-red text-white rounded-lg font-medium text-sm hover:bg-red-700 transition-colors">Practice</button>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body></html>
