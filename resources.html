<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
      colors: { brand: { red:'#C91F2B', bg:'#F8F5EF', text:'#334155', muted:'#64748B', border:'#E2E8F0' },
                status: { green:'#10B981', red:'#EF4444', orange:'#F59E0B', purple:'#8B5CF6', blue:'#3B82F6', teal:'#14B8A6' } },
      boxShadow: { 'card':'0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03)' },
      borderRadius: { 'xl':'1rem' } } } }
</script>
<style>

  ::-webkit-scrollbar { width:6px; height:6px; }

  ::-webkit-scrollbar-thumb { background:#CBD5E1; border-radius:3px; }

<body class="font-sans antialiased h-screen flex overflow-hidden" data-page="resources">
  <aside id="layout-sidebar"></aside>
  <main class="flex-1 flex flex-col h-full overflow-hidden relative">
    <div id="layout-topbar"></div>
    <div class="flex-1 overflow-y-auto p-8 relative z-10">
      <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
        <div>

          <p class="text-brand-muted mt-1">Access teaching materials and share your own.</p>
        </div>
        <button class="bg-brand-red text-white px-6 py-2.5 rounded-lg font-medium text-sm flex items-center gap-2 hover:bg-red-700 transition-colors shadow-sm self-start"><i class="fa-solid fa-upload"></i> Upload Resource</button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-xl p-5 shadow-card border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-red-100 text-brand-red flex items-center justify-center text-xl flex-shrink-0"><i class="fa-solid fa-book-open"></i></div>
          <div><h3 class="text-2xl font-bold text-gray-900 leading-tight">120</h3><p class="text-sm font-medium text-gray-700">Total Resources</p></div>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-card border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-purple-100 text-status-purple flex items-center justify-center text-xl flex-shrink-0"><i class="fa-solid fa-download"></i></div>
          <div><h3 class="text-2xl font-bold text-gray-900 leading-tight">2.4k</h3><p class="text-sm font-medium text-gray-700">Downloads</p></div>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-card border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-green-100 text-status-green flex items-center justify-center text-xl flex-shrink-0"><i class="fa-solid fa-users"></i></div>
          <div><h3 class="text-2xl font-bold text-gray-900 leading-tight">45</h3><p class="text-sm font-medium text-gray-700">Contributors</p></div>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-card border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-yellow-100 text-status-orange flex items-center justify-center text-xl flex-shrink-0"><i class="fa-solid fa-star"></i></div>
          <div><h3 class="text-2xl font-bold text-gray-900 leading-tight">4.8</h3><p class="text-sm font-medium text-gray-700">Avg. Rating</p></div>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 mb-6">
        <button class="px-4 py-2 bg-brand-red text-white rounded-lg text-sm font-medium">All</button>
        <button class="px-4 py-2 bg-white border border-gray-200 text-brand-text rounded-lg text-sm font-medium hover:bg-gray-50">Lesson Plans</button>
        <button class="px-4 py-2 bg-white border border-gray-200 text-brand-text rounded-lg text-sm font-medium hover:bg-gray-50">Worksheets</button>
        <button class="px-4 py-2 bg-white border border-gray-200 text-brand-text rounded-lg text-sm font-medium hover:bg-gray-50">Videos</button>
        <button class="px-4 py-2 bg-white border border-gray-200 text-brand-text rounded-lg text-sm font-medium hover:bg-gray-50">Presentations</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
        <div class="bg-white rounded-xl border border-gray-100 shadow-card p-5">
          <div class="flex items-center gap-3 mb-3"><div class="w-10 h-10 rounded-lg bg-red-100 text-brand-red flex items-center justify-center"><i class="fa-solid fa-chalkboard-user"></i></div><div><h4 class="font-bold text-gray-900">Photosynthesis Lesson Plan</h4><p class="text-xs text-brand-muted">Lesson Plan · 2.1 MB</p></div></div>
          <div class="flex items-center gap-2"><button class="flex-1 py-2 bg-gray-50 text-brand-text rounded-lg text-sm font-medium hover:bg-gray-100">Preview</button><button class="flex-1 py-2 bg-brand-red text-white rounded-lg text-sm font-medium hover:bg-red-700">Download</button></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-card p-5">
          <div class="flex items-center gap-3 mb-3"><div class="w-10 h-10 rounded-lg bg-purple-100 text-status-purple flex items-center justify-center"><i class="fa-solid fa-circle-play"></i></div><div><h4 class="font-bold text-gray-900">States of Matter Video</h4><p class="text-xs text-brand-muted">Video · 18 min</p></div></div>
          <div class="flex items-center gap-2"><button class="flex-1 py-2 bg-gray-50 text-brand-text rounded-lg text-sm font-medium hover:bg-gray-100">Preview</button><button class="flex-1 py-2 bg-brand-red text-white rounded-lg text-sm font-medium hover:bg-red-700">Download</button></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-card p-5">
          <div class="flex items-center gap-3 mb-3"><div class="w-10 h-10 rounded-lg bg-green-100 text-status-green flex items-center justify-center"><i class="fa-solid fa-file-powerpoint"></i></div><div><h4 class="font-bold text-gray-900">Ecosystem Presentation</h4><p class="text-xs text-brand-muted">Presentation · 5.4 MB</p></div></div>
          <div class="flex items-center gap-2"><button class="flex-1 py-2 bg-gray-50 text-brand-text rounded-lg text-sm font-medium hover:bg-gray-100">Preview</button><button class="flex-1 py-2 bg-brand-red text-white rounded-lg text-sm font-medium hover:bg-red-700">Download</button></div>
        </div>
      </div>
    </div>
